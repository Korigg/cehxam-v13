services:
  cehxam-v13:
    build:
      context: .
      dockerfile: Dockerfile
    image: cehxam-v13:latest
    container_name: cehxam-v13
    restart: unless-stopped
    ports:
      - "10.0.0.76:8088:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
